# Утренний бриф PO: навыки poh-morning-status (`/morning`, `/mts-link-sync`) как
# отдельный провайдер навыков харнесса.
#
# Файл едет вместе с пакетом, путей конкретной машины здесь нет: каталог навыков
# плагин находит сам — `skills/` рядом с пакетом. Переопределить можно слоем
# профиля точечной правкой по идентификатору:
#
#   - id: morning-status
#     config:
#       skillsDir: '/путь/к/poh-morning-status/skills'
#
# Данные бриф берёт из Backlog.md через штатные инструменты `mcp__backlog__*`
# (строка `backlog-md` профиля) — плагину они не принадлежат, но без них навык
# честно сообщит, что источника нет.
#
# Секретов здесь быть не должно: файл лежит в репозитории.
- insert:
    - id: morning-status
      name: poh-morning-plugin
      config: {}
